<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Kavira: a place for poets writing in English and Hindi to share poems and review each other."
        />
        <title>Kavira - Poem</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap"
        />
        <link rel="stylesheet" href="../../shared/css/tokens.css" />
        <link rel="stylesheet" href="../../shared/css/base.css" />
        <link rel="stylesheet" href="../../shared/css/components.css" />
        <link rel="stylesheet" href="../../shared/css/layout.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="app">
            <aside class="app__nav">
                <a class="app__logo" href="../home/index.html">Kavira</a>
                <nav id="menu" class="menu" aria-label="Main"></nav>
            </aside>
            <main class="app__main">
                <div class="app__header"><a class="poem__back" href="../home/index.html">&larr; Home</a></div>

                <article id="poem" class="poem" hidden>
                    <header class="poem__head">
                        <h1 id="poem-title"></h1>
                        <p class="poem__byline">
                            <span id="poem-author"></span> · <span id="poem-meta"></span>
                        </p>
                    </header>
                    <div id="poem-text" class="poem__text"></div>
                    <button id="save-button" class="btn btn--small" type="button"></button>
                </article>

                <p id="poem-missing" class="poem__missing" hidden>This poem could not be found.</p>

                <section id="reviews-section" class="poem__section" hidden>
                    <h2>Reviews</h2>
                    <form id="review-form" class="poem__form" novalidate>
                        <div class="field">
                            <label for="review-text">Your review</label>
                            <textarea
                                id="review-text"
                                rows="5"
                                placeholder="What worked, what moved you, what you would try differently."
                            ></textarea>
                            <p class="write__count" id="review-count" aria-live="polite"></p>
                            <p class="field__error" id="review-error" role="alert"></p>
                        </div>
                        <button class="btn btn--primary" type="submit">Post review</button>
                    </form>
                    <p id="review-note" class="field__hint" hidden></p>
                    <div id="review-list"></div>
                </section>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../../shared/js/config.js"></script>
        <script src="../../shared/js/db.js"></script>
        <script src="../../shared/js/utils.js"></script>
        <script src="../../shared/js/store.js"></script>
        <script src="../../shared/js/auth.js"></script>
        <script src="../../shared/js/poems.js"></script>
        <script src="../../shared/js/reviews.js"></script>
        <script src="../../shared/js/circle.js"></script>
        <script src="../../shared/js/layout.js"></script>
        <script src="../../shared/js/poem-card.js"></script>
        <script src="script.js"></script>
    </body>
</html>
